<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aplicaciones | Spatialis S.A.S.</title>
<meta name="description" content="Aplicaciones web geoespaciales de demostración de Spatialis S.A.S.">
<style>
:root{--bg:#f6f8fa;--fg:#1f2328;--muted:#59636e;--card:#fff;--line:#d1d9e0;--accent:#0b6e75}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--card:#161b22;--line:#30363d;--accent:#4fc3cc}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5}
main{max-width:760px;margin:0 auto;padding:48px 20px}
h1{margin:0 0 8px;font-size:1.9rem}
.lead{margin:0 0 32px;color:var(--muted)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
a.card{display:block;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a.card strong{display:block;font-size:1.1rem;color:var(--accent)}
a.card span{color:var(--muted);font-size:.92rem}
footer{margin-top:40px;color:var(--muted);font-size:.9rem}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Aplicaciones</h1>
<p class="lead">Aplicaciones web geoespaciales de demostración de Spatialis S.A.S.</p>
<div class="grid">
<a class="card" href="SIGApp/"><strong>SIGApp</strong><span>Visor SIG con componentes de ArcGIS</span></a>
<a class="card" href="appDashboardSIG/"><strong>Dashboard SIG</strong><span>Panel de control con mapa interactivo, resumen y filtros</span></a>
</div>
<footer>
<p><a href="https://spatialis.com.co">spatialis.com.co</a> · <a href="https://github.com/spatialis-co/aplicaciones">Repositorio en GitHub</a> · <a href="../geovisores/">Más demos: geovisores</a></p>
</footer>
</main>
</body>
</html>
