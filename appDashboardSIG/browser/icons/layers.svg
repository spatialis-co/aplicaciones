<svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" viewBox="0 -960 960 960" fill="#e3e3e3" aria-hidden="true">
  <title>clusters</title>
  <desc>Representation of data clusters: central circle with surrounding smaller circles.</desc>
  <!-- Central cluster -->
  <circle cx="480" cy="-480" r="120"/>
  <!-- Surrounding nodes -->
  <circle cx="280" cy="-480" r="60"/>
  <circle cx="680" cy="-480" r="60"/>
  <circle cx="480" cy="-680" r="60"/>
  <circle cx="480" cy="-280" r="60"/>
  <circle cx="340" cy="-340" r="45"/>
  <circle cx="620" cy="-340" r="45"/>
  <circle cx="340" cy="-620" r="45"/>
  <circle cx="620" cy="-620" r="45"/>
</svg>
