  <style>
    /* Pantalla de carga: la aplicación tarda en arrancar y, sin esto, el
       usuario ve un blanco sin explicación durante varios segundos. */
    #sp-arranque {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #060b17;
      color: #f8fafc;
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .4s ease, visibility .4s;
    }

    #sp-arranque[hidden] { display: grid; opacity: 0; visibility: hidden; }

    #sp-arranque .sp-caja { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 24px; }

    #sp-arranque .sp-marca {
      width: 46px;
      height: 46px;
      object-fit: contain;
      filter: drop-shadow(0 0 14px rgba(0, 199, 253, .45));
      animation: sp-latido 1.8s cubic-bezier(.16, 1, .3, 1) infinite;
    }

    #sp-arranque .sp-txt { font-size: 13.5px; font-weight: 500; color: #94a3b8; }
    #sp-arranque .sp-sub { font-size: 11.5px; color: #64748b; }

    #sp-arranque .sp-barra {
      width: 170px;
      height: 3px;
      border-radius: 99px;
      background: #111e38;
      overflow: hidden;
    }

    #sp-arranque .sp-barra::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #00c7fd, transparent);
      animation: sp-barrido 1.3s linear infinite;
    }

    @keyframes sp-latido {
      0%, 100% { transform: scale(1); opacity: .92; }
      50% { transform: scale(1.07); opacity: 1; }
    }

    @keyframes sp-barrido {
      from { transform: translateX(-100%); }
      to { transform: translateX(338%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #sp-arranque .sp-marca, #sp-arranque .sp-barra::after { animation: none; }
    }
  </style>
</head>

<body>
  <div id="sp-arranque" role="status" aria-live="polite">

<img class="sp-marca" src="spatialis-isotipo.png" alt="" width="46" height="46">

  <app-root></app-root>

  <script>
    /* El arranque se retira cuando Angular ya pintó contenido dentro de
       <app-root>, no tras un tiempo fijo. */
    (function () {
      var velo = document.getElementById("sp-arranque");
      var raiz = document.querySelector("app-root");
      if (!velo || !raiz) return;

      function quitar() {
        velo.hidden = true;
        setTimeout(function () { velo.remove(); }, 500);
      }

      if (raiz.childElementCount > 0) return quitar();

      var obs = new MutationObserver(function () {
        if (raiz.childElementCount > 0) { obs.disconnect(); quitar(); }
      });
      obs.observe(raiz, { childList: true });

      /* red de seguridad: nunca dejar el velo puesto */
      setTimeout(function () { obs.disconnect(); quitar(); }, 20000);
    })();
  </script>

  <script>
    /* Colapsa (oculta) la barra de navegación por defecto en cuanto el app la
       renderiza, usando su propio botón de menú; el ☰ del encabezado la abre. */
    (function () {
      var hecho = false;
      function colapsar() {
        if (hecho) return;
        var nav = document.querySelector("nav.nav-sidebar");
        var btn = [].slice.call(document.querySelectorAll("button.icon-btn"))
          .filter(function (b) { return /colapsar|men[uú]/i.test(b.title || ""); })[0];
        if (nav && btn && !nav.classList.contains("collapsed")) {
          btn.click();
          hecho = true;
          obs.disconnect();
        }
      }
      var obs = new MutationObserver(colapsar);
      obs.observe(document.documentElement, { childList: true, subtree: true });
      setTimeout(function () { obs.disconnect(); }, 10000);
    })();
  </script>
